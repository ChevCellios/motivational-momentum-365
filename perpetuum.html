<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perpetuum · Motivational Momentum 365</title>
<meta name="description" content="A cyberpunk visual experiment: Perpetuum. Every ending sets a new beginning in motion.">
<style>
*{box-sizing:border-box}body{margin:0;background:#070d11;color:#e7eff0;font-family:system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:28px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{font-size:12px;letter-spacing:.16em;color:#92aaaf}a{color:#86cfd5;text-decoration:none;font-size:12px}figure{margin:0;border:1px solid #25343a;background:#071217;overflow:hidden;border-radius:4px}img{display:block;width:100%;height:auto}footer{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:24px}h1{margin:0;font-weight:300;letter-spacing:.17em;font-size:clamp(24px,4vw,44px)}p{color:#8ea5ac;font-size:13px;line-height:1.7;margin:9px 0}.number{color:#59b7c1;font-size:11px;letter-spacing:.2em}button{font:inherit;font-size:12px;background:transparent;border:1px solid #405860;border-radius:3px;color:#cce3e7;padding:10px 18px;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #a3eaff;outline-offset:4px}@media(max-width:600px){main{padding:20px 12px}.brand{font-size:9px}footer{align-items:flex-start}p{font-size:11px}}
</style>
</head>
<body>
<main>
<header><span class="brand">MOTIVATIONAL MOMENTUM 365</span><a href="https://github.com/ChevCellios/motivational-momentum-365">GitHub ↗</a></header>
<figure><img id="art" src="perpetuum.gif" width="960" height="540" alt="Two people with futuristic gadgets beside a perpetual motion machine and glowing RGB bricks."></figure>
<footer><div><span class="number">001 / VISUAL EXPERIMENT</span><h1>PERPETUUM</h1><p>Every ending sets a new beginning in motion.</p><a href="teleportation.html">002 — Teleportation →</a></div><button id="toggle" type="button" aria-pressed="true">Pause</button></footer>
</main>
<script>
const art=document.getElementById('art'),button=document.getElementById('toggle');
let running=true;
function update(){art.src=running?'perpetuum.gif':'assets/poster.jpg';button.textContent=running?'Pause':'Play';button.setAttribute('aria-pressed',String(running));}
button.addEventListener('click',()=>{running=!running;update()});update();
</script>
</body>
</html>
